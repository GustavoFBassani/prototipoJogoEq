<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <style>
    .math-text { font-family: 'Fira Code', 'STIX Two Text', monospace; fill: #1e293b; opacity: 0.065; font-size: 14px; font-weight: 600; }
    .math-text-sm { font-family: 'Fira Code', monospace; fill: #1e293b; opacity: 0.055; font-size: 11px; font-weight: 500; }
    .math-text-lg { font-family: 'Fira Code', 'STIX Two Text', serif; fill: #1e293b; opacity: 0.075; font-size: 17px; font-weight: 700; }
    .math-draw { stroke: #1e293b; opacity: 0.06; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  </style>

  <!-- Linha 1 -->
  <g transform="rotate(-5 60 70)">
    <text x="40" y="70" class="math-text-lg">2x + 5 = 15</text>
    <path d="M 140 68 C 135 55 175 55 178 68 C 180 80 137 80 136 68" class="math-draw" />
    <text x="186" y="70" class="math-text-sm">x = 5</text>
  </g>

  <g transform="rotate(4 310 60)">
    <text x="290" y="60" class="math-text">Δ = b² − 4ac</text>
  </g>

  <g transform="rotate(-3 550 75)">
    <text x="520" y="75" class="math-text">x/3 = 7  ⇒  x = 21</text>
  </g>

  <!-- Gráfico cartesiano mini -->
  <g transform="translate(680, 40)">
    <path d="M 10 50 L 70 50 M 65 47 L 71 50 L 65 53" class="math-draw" />
    <path d="M 30 70 L 30 10 M 27 15 L 30 9 L 33 15" class="math-draw" />
    <path d="M 15 60 L 60 15" class="math-draw" stroke-dasharray="3 2" />
    <text x="74" y="53" class="math-text-sm">x</text>
    <text x="28" y="7" class="math-text-sm">y</text>
  </g>

  <!-- Linha 2 -->
  <g transform="rotate(6 100 170)">
    <text x="80" y="170" class="math-text">3x − 4 = 11</text>
    <text x="80" y="190" class="math-text-sm">3x = 15 ⇒ x = 5</text>
  </g>

  <!-- Triângulo Pitágoras -->
  <g transform="translate(320, 130)">
    <polygon points="10,50 60,50 10,20" class="math-draw" />
    <rect x="10" y="44" width="6" height="6" class="math-draw" />
    <text x="70" y="45" class="math-text">a² + b² = c²</text>
  </g>

  <g transform="rotate(-7 600 170)">
    <text x="570" y="170" class="math-text">f(x) = 2x + 1</text>
    <text x="570" y="190" class="math-text-sm">f(3) = 7</text>
  </g>

  <!-- Símbolos de Operação Soltos -->
  <g transform="translate(200, 200)">
    <text x="0" y="0" class="math-text-lg">+   −   ×   ÷   =   ≠   ±</text>
  </g>

  <!-- Linha 3 -->
  <!-- Balança Esboço -->
  <g transform="translate(50, 260)">
    <line x1="20" y1="30" x2="90" y2="30" class="math-draw" />
    <polygon points="55,30 60,42 50,42" class="math-draw" />
    <path d="M 20 30 L 15 42 L 35 42 Z" class="math-draw" />
    <path d="M 90 30 L 80 42 L 100 42 Z" class="math-draw" />
    <text x="22" y="39" class="math-text-sm">x</text>
    <text x="87" y="39" class="math-text-sm">3</text>
  </g>

  <g transform="rotate(-4 320 280)">
    <text x="230" y="280" class="math-text-lg">5x = 2x + 12</text>
    <text x="230" y="300" class="math-text-sm">3x = 12  ⇒  x = 4</text>
  </g>

  <g transform="rotate(5 630 270)">
    <text x="600" y="270" class="math-text">π ≈ 3.14159</text>
    <text x="600" y="292" class="math-text-sm">C = 2πr</text>
  </g>

  <g transform="translate(710, 290)">
    <text x="0" y="0" class="math-text">√(x + 9)</text>
  </g>

  <!-- Linha 4 -->
  <g transform="rotate(4 80 390)">
    <text x="60" y="390" class="math-text">x − 7 = 3  ⇒  x = 10</text>
  </g>

  <g transform="rotate(-6 270 390)">
    <text x="220" y="390" class="math-text">(x + 2)(x − 2) = x² − 4</text>
  </g>

  <g transform="translate(480, 380)">
    <text x="0" y="0" class="math-text-lg">∑ xᵢ  (i = 1 .. n)</text>
  </g>

  <g transform="rotate(3 650 400)">
    <text x="610" y="400" class="math-text">4x + 8 = 0  ⇒  x = −2</text>
  </g>

  <!-- Linha 5 -->
  <g transform="rotate(-5 120 490)">
    <text x="80" y="490" class="math-text">x/4 + 1 = 5  ⇒  x = 16</text>
  </g>

  <!-- Plano de Pontos -->
  <g transform="translate(320, 460)">
    <circle cx="20" cy="30" r="2.5" fill="#1e293b" opacity="0.08" />
    <circle cx="45" cy="15" r="2.5" fill="#1e293b" opacity="0.08" />
    <circle cx="70" cy="0" r="2.5" fill="#1e293b" opacity="0.08" />
    <line x1="10" y1="36" x2="80" y2="-6" class="math-draw" stroke-dasharray="2 2" />
    <text x="85" y="5" class="math-text-sm">y = mx + b</text>
  </g>

  <g transform="rotate(7 570 480)">
    <text x="530" y="480" class="math-text">6x − 2 = 16  ⇒  x = 3</text>
  </g>

  <g transform="rotate(-4 720 500)">
    <text x="690" y="500" class="math-text-sm">x ∈ ℝ , y ∈ ℝ</text>
  </g>

  <!-- Linha 6 -->
  <g transform="rotate(3 90 570)">
    <text x="50" y="570" class="math-text">ax + b = 0  ⇒  x = −b/a</text>
  </g>

  <g transform="rotate(-2 360 570)">
    <text x="320" y="570" class="math-text-lg">LHS = RHS  (Equilíbrio)</text>
  </g>

  <g transform="rotate(-5 550 570)">
    <text x="490" y="570" class="math-text">2(x − 3) = 14  ⇒  x = 10</text>
  </g>

  <!-- Fraçãozinha clássica -->
  <g transform="translate(710, 550)">
    <text x="0" y="10" class="math-text">½ + ¾ = ⁵⁄₄</text>
  </g>
</svg>
