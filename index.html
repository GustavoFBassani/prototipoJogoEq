<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EquaLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Outfit:wght@400;500;600;700;800&family=STIX+Two+Text:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="particle-canvas"></canvas>

  <header>
    <div class="header-inner">
      <div class="logo-area">
        <span class="logo-icon">⚖️</span>
        <div>
          <h1 class="logo-title">EquaLab</h1>
        </div>
      </div>
      <div class="header-controls">
        <div class="level-badge" title="Nível">
          <span id="current-level-label">1/14</span>
        </div>
        <button type="button" class="icon-btn" id="btn-levels" title="Escolher Fase">🗺️</button>
        <button type="button" class="icon-btn" id="btn-sound" title="Alternar Som">🔊</button>
      </div>
    </div>
  </header>

  <div class="app">
  <main>
    <section class="playfield">
      <section class="board">
        <div class="equation-display-card">
          <div class="math-formula-wrapper">
            <span class="math-side-lhs" id="math-lhs">x + 2</span>
            <span class="math-equal-sign">=</span>
            <span class="math-side-rhs" id="math-rhs">5</span>
          </div>
          <div class="instruction-hint" id="instruction-hint" hidden></div>
        </div>

        <div class="containers-grid">
          <div class="equation-container container-lhs" id="container-lhs">
            <div class="items-dropzone" id="dropzone-lhs"></div>
          </div>

          <div class="scale-center-divider">
            <div class="equal-circle">=</div>
          </div>

          <div class="equation-container container-rhs" id="container-rhs">
            <div class="items-dropzone" id="dropzone-rhs"></div>
          </div>
        </div>
      </section>

    <div class="ops-header-area">
      <h3 class="ops-title">Escolha a operação desejada</h3>
      <div class="ops-speech-bubble" id="ops-speech-bubble" aria-live="polite">
        <span class="speech-bubble-text" id="ops-speech-bubble-text"></span>
      </div>
    </div>

    <section class="operations-panel">
      <div class="ops-buttons-grid">
        <button type="button" class="op-btn op-btn-pos-one" data-op="add" data-hint="Soma o mesmo valor aos dois lados da equação" title="Somar nos dois lados" aria-label="Somar">
          <span class="op-symbol">+</span>
        </button>
        <button type="button" class="op-btn op-btn-neg-one" data-op="subtract" data-hint="Subtrai o mesmo valor dos dois lados da equação" title="Subtrair nos dois lados" aria-label="Subtrair">
          <span class="op-symbol">−</span>
        </button>
        <button type="button" class="op-btn op-btn-mult" data-op="multiply" data-hint="Multiplica os dois lados da equação para eliminar frações" title="Multiplicar os dois lados" aria-label="Multiplicar">
          <span class="op-symbol">×</span>
        </button>
        <button type="button" class="op-btn op-btn-div" data-op="divide" data-hint="Divide os dois lados da equação para isolar o x" title="Dividir os dois lados" aria-label="Dividir">
          <span class="op-symbol">÷</span>
        </button>
      </div>
      <div class="op-number-panel" id="op-number-panel" hidden>
        <fieldset class="operand-selector" id="operand-selector">
          <legend id="operand-legend">Número ou x?</legend>
          <label class="operand-label-number">
            <input type="radio" name="operand" id="operand-number" value="number" checked>
            <span>número</span>
          </label>
          <label class="operand-label-unknown">
            <input type="radio" name="operand" id="operand-unknown" value="unknown">
            <span>x</span>
          </label>
        </fieldset>
        <button type="button" class="icon-btn op-back-btn" id="btn-op-number-cancel" title="Voltar às operações" aria-label="Voltar às operações">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="13" y1="8" x2="3" y2="8"/>
            <polyline points="7 4 3 8 7 12"/>
          </svg>
        </button>
        <input type="number" id="op-number-value" value="1" step="any">
        <button type="button" class="btn-next-level" id="btn-op-number-ok">Ok</button>
        <p class="op-number-note" id="op-number-note" hidden></p>
      </div>
    </section>

    <div class="footer-actions">
      <button type="button" class="action-pill-btn" id="btn-reset" aria-keyshortcuts="R">
        <svg class="btn-icon btn-icon-reload" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9L2 6"/>
          <path d="M2 2v4h4"/>
        </svg>
        <span>Reiniciar</span>
      </button>
      <button type="button" class="action-pill-btn" id="btn-hint" aria-pressed="false">
        <svg class="btn-icon btn-icon-hint" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="8" r="4"/>
          <line x1="8" y1="1" x2="8" y2="2.5"/>
          <line x1="8" y1="13.5" x2="8" y2="15"/>
          <line x1="1" y1="8" x2="2.5" y2="8"/>
          <line x1="13.5" y1="8" x2="15" y2="8"/>
        </svg>
        <span>Dica</span>
      </button>
      <button type="button" class="action-pill-btn" id="btn-custom-eq">
        <span>Equação livre</span>
        <svg class="btn-arrow" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="8" x2="13" y2="8"/>
          <polyline points="9 4 13 8 9 12"/>
        </svg>
      </button>
    </div>
    </section>
  </main>
  </div>

  <div class="modal-backdrop" id="win-modal" inert>
    <div class="win-card">
      <div class="win-trophy">🏆</div>
      <h2 class="win-title">Resolvida</h2>
      <div class="win-equation" id="win-sol-text">x = 3</div>
      <p class="win-desc" id="win-message">O x ficou sozinho.</p>
      <button type="button" class="btn-next-level" id="btn-next-level" aria-keyshortcuts="Enter">
        <span id="btn-next-level-label">Próxima</span>
        <kbd>Enter</kbd>
      </button>
    </div>
  </div>

  <div class="modal-backdrop" id="levels-modal" inert>
    <div class="win-card levels-card">
      <h2 class="win-title">Fases</h2>
      <div class="level-picker-grid" id="levels-grid"></div>
      <button type="button" class="action-pill-btn modal-close-btn" id="btn-close-levels">Fechar</button>
    </div>
  </div>

  <div class="modal-backdrop" id="custom-modal" inert>
    <div class="win-card custom-card">
      <h2 class="win-title">Equação livre</h2>
      <div class="custom-inputs-row">
        <input type="number" id="cust-lx" class="cust-input" value="2"> <span class="custom-op-label">x +</span>
        <input type="number" id="cust-lc" class="cust-input" value="3"> <span class="custom-op-label">=</span>
        <input type="number" id="cust-rx" class="cust-input" value="1"> <span class="custom-op-label">x +</span>
        <input type="number" id="cust-rc" class="cust-input" value="5">
      </div>
      <p class="op-number-note" id="custom-eq-note" hidden></p>
      <button type="button" class="btn-next-level" id="btn-start-custom">Jogar</button>
      <button type="button" class="action-pill-btn modal-close-btn" id="btn-close-custom">Cancelar</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
